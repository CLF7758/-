[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.png"]

[project]
name = "Prism"
version = "0.3.4-dev"
description = "A simple reference image viewer"
readme = "README.rst"
license = {file = "LICENSE"}
authors = [
    { name = "Rebecca Breu", email = "rebecca@rbreu.de" },
]
requires-python = ">=3.9,<3.13"
dependencies = [
    "exif>=1.3.5,<=1.6.0",
    "lxml==5.1.0",
    "pyQt6-Qt6>=6.7.0,<=6.7.0",
    "pyQt6>=6.7.0,<=6.7.0",
    "rectangle-packer>=2.0.1,<=2.0.2",
]

[project.gui-scripts]
prism = "prism.__main__:main"

[project.urls]
Homepage = "https://prism.org/"
Repository = "https://github.com/rbreu/prism"
# Documentation =
Issues = "https://github.com/rbreu/prism/issues"
Changelog = "https://github.com/rbreu/prism/blob/main/CHANGELOG.rst"